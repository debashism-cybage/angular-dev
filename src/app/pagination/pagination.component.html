```html
<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Search Employees" 
        (input)="onSearch($event.target.value)">
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-12">
      <div *ngIf="loading">Loading...</div>
      <div *ngIf="error">{{ error }}</div>
      <div *ngIf="employees.length > 0">
        <ul class="list-group">
          <li 
            class="list-group-item" 
            *ngFor="let employee of employees" 
            (click)="viewDetails(employee)">
            {{ employee.name }}
          </li>
        </ul>
        
        <pagination 
          [totalItems]="totalItems" 
          [currentPage]="currentPage" 
          (pageChange)="onPageChange($event)"></pagination>
      </div>
      <div *ngIf="employees.length === 0 &&!loading &&!error">
        No employees found.
      </div>
    </div>
  </div>

  <div *ngIf="selectedEmployee" class="mt-3">
    <h3>Employee Details</h3>
    <p><strong>Name:</strong> {{ selectedEmployee.name }}</p>
    <p><strong>Email:</strong> {{ selectedEmployee.email }}</p>
    <p><strong>Phone:</strong> {{ selectedEmployee.phone }}</p>
    <button class="btn btn-secondary" (click)="closeDetails()">Close</button>
  </div>
</div>
```
