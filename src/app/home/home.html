<div class="home-container">
  <h1>Welcome to the App</h1>

  <div class="user-info">
    <p>You are logged in.</p>
  </div>

  <div class="developer-selection">
    <label for="developer">Select Developer:</label>
    <select id="developer" name="developer">
      <option value="">-- Select a Developer --</option>
      <option value="dev1">Developer 1</option>
      <option value="dev2">Developer 2</option>
      <option value="dev3">Developer 3</option>
    </select>
  </div>

  <div class="logout-section">
    <button (click)="logout()">Logout</button>
  </div>
</div>
