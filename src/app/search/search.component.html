```html
<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <input type="text" class="form-control" placeholder="Search by name" (input)="onSearch($event.target.value)" />
    </div>
  </div>
  <div class="row mt-3">
    <div *ngIf="loading" class="col-12 text-center">
      <img src="assets/loading.gif" alt="Loading..." />
    </div>
    <div *ngIf="error" class="col-12 text-center text-danger">
      {{ error }}
    </div>
    <div *ngIf="employees.length > 0" class="col-12">
      <div class="row" *ngFor="let employee of employees">
        <div class="col-md-6 mb-3">
          <div class="card" (click)="showDetails(employee.id)">
            <div class="card-body">
              <h5 class="card-title">{{ employee.name }}</h5>
              <p class="card-text">{{ employee.position }}</p>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12 text-center">
          <button class="btn btn-primary" (click)="previousPage()">Previous</button>
          <button class="btn btn-primary" (click)="nextPage()">Next</button>
        </div>
      </div>
    </div>
    <div *ngIf="employees.length === 0 && !loading" class="col-12 text-center">
      <p>No employees found</p>
    </div>
  </div>
</div>
