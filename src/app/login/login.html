<div class="login-container">
  <div class="login-card">
    <h1>Welcome Back</h1>
    <p>Sign in to continue</p>

    @if (error()) {
      <div class="error-msg">{{ error() }}</div>
    }

    <form (ngSubmit)="signInWithEmail()" class="login-form">
      <div class="form-group">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          autocomplete="email"
          [disabled]="emailSubmitting() || googleSubmitting()"
        />
      </div>
      <div class="form-group">
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          [disabled]="emailSubmitting() || googleSubmitting()"
        />
      </div>
      <button type="submit" class="primary-btn" [disabled]="emailSubmitting() || googleSubmitting()">
        @if (emailSubmitting()) {
          <span class="spinner"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>

    <div class="divider">
      <span>or</span>
    </div>

    <button
      class="google-btn"
      (click)="signInWithGoogle()"
      [disabled]="emailSubmitting() || googleSubmitting()"
    >
      @if (googleSubmitting()) {
        <span class="spinner google-spinner"></span>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 48 48"
          width="24"
          height="24"
        >
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
          <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
      }
      <span>Sign in with Google</span>
    </button>

    <p class="signup-link">
      Don't have an account? <a routerLink="/signup">Sign Up</a>
    </p>

    <div *ngIf="isLoggedIn()">
      <label for="developers">Select Developer:</label>
      <select id="developers" name="developers">
        <option value="debashis">Debashis</option>
        <option value="yogesh">Yogesh</option>
        <option value="varsha">Varsha</option>
        <option value="rohan">Rohan</option>
      </select>
    </div>
  </div>
</div>
