@if (isLoading()) {
  <div class="loading-container">
    <div class="loading-spinner"></div>
  </div>
} @else if (isAuthenticated()) {
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">angular-dev</h1>
      <div class="user-info">
        @if (user()?.photoURL) {
          <img [src]="user()!.photoURL" [alt]="user()!.displayName" class="avatar" referrerpolicy="no-referrer" />
        }
        <span class="user-name">{{ user()?.displayName || user()?.email }}</span>
        <button class="logout-btn" (click)="logout()">Sign Out</button>
      </div>
    </header>
    <main class="app-main">
      <div class="welcome-section">
        <h2 class="welcome-heading">Welcome back, {{ user()?.displayName || 'User' }}!</h2>
        <p class="welcome-sub">You're all set. Start building something amazing.</p>
      </div>
    </main>
  </div>
} @else {
  <router-outlet />
}
