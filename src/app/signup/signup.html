<div class="signup-container">
  <div class="signup-card">
    <h1>Create Account</h1>
    <p>Sign up to get started</p>

    @if (error()) {
      <div class="error-msg">{{ error() }}</div>
    }

    <form (ngSubmit)="signUp()" class="signup-form">
      <div class="form-group">
        <input
          type="text"
          [(ngModel)]="displayName"
          name="displayName"
          placeholder="Full Name"
          autocomplete="name"
          [disabled]="submitting()"
        />
      </div>
      <div class="form-group">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          autocomplete="email"
          [disabled]="submitting()"
        />
      </div>
      <div class="form-group password-input-container">
        <input
          type="{{ passwordType }}"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          autocomplete="new-password"
          [disabled]="submitting()"
        />
        <i class="eye-icon" (click)="togglePasswordVisibility()">
          <img src="assets/eye-{{ passwordVisible? 'open' : 'closed' }}.png" alt="Toggle Password Visibility">
        </i>
      </div>
      <div class="form-group">
        <input
          type="{{ confirmPasswordType }}"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm Password"
          autocomplete="new-password"
          [disabled]="submitting()"
        />
        <i class="eye-icon" (click)="toggleConfirmPasswordVisibility()">
          <img src="assets/eye-{{ confirmPasswordVisible? 'open' : 'closed' }}.png" alt="Toggle Confirm Password Visibility">
        </i>
      </div>
      <button type="submit" class="primary-btn" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner"></span>
          <span>Creating account...</span>
        } @else {
          <span>Sign Up</span>
        }
      </button>
    </form>

    <p class="login-link">
      Already have an account? <a routerLink="/login">Sign In</a>
    </p>
  </div>
</div>

<style>
  .password-input-container {
    position: relative;
  }
  .eye-icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
  }
</style>
