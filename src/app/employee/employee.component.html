```html
<div class="employee-dashboard" role="main">
  <h1>Employee Dashboard</h1>
  <div class="search-bar">
    <input type="text" placeholder="Search employees by name" [(ngModel)]="searchTerm" (input)="searchEmployees()">
  </div>
  <div class="employee-list">
    <table mat-table [dataSource]="employees" class="mat-elevation-z8" role="grid">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let employee"> {{employee.name}} </td>
      </ng-container>
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef> Position </th>
        <td mat-cell *matCellDef="let employee"> {{employee.position}} </td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let employee">
          <button mat-button (click)="openEmployeeDetails(employee)" aria-label="View details of {{employee.name}}">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['name', 'position', 'action']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['name', 'position', 'action'];"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons aria-label="Pagination for employee list"></mat-paginator>
  </div>
</div>

<app-employee-details *ngIf="selectedEmployee" [employee]="selectedEmployee"></app-employee-details>
